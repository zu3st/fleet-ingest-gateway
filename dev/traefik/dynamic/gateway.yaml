# Per-tenant routes for the dev stack. To add a tenant, copy a router and its
# fleet-authz-<tenant> middleware and add its certificate below.
http:
  routers:
    ingest-acme:
      entryPoints: [websecure]
      rule: 'Host(`ingest-acme.local`) && ((Path(`/_bulk`) && Method(`POST`)) || (Path(`/`) && (Method(`GET`) || Method(`HEAD`))))'
      middlewares: [strip-runas, fleet-authz-acme]
      service: elasticsearch
      tls: {}
    ingest-globex:
      entryPoints: [websecure]
      rule: 'Host(`ingest-globex.local`) && ((Path(`/_bulk`) && Method(`POST`)) || (Path(`/`) && (Method(`GET`) || Method(`HEAD`))))'
      middlewares: [strip-runas, fleet-authz-globex]
      service: elasticsearch
      tls: {}
  middlewares:
    strip-runas:
      headers:
        customRequestHeaders:
          es-security-runas-user: ""
    fleet-authz-acme:
      forwardAuth:
        address: http://fleet-authz:8080/check?tenant=acme
        trustForwardHeader: false
        maxResponseBodySize: 4096
    fleet-authz-globex:
      forwardAuth:
        address: http://fleet-authz:8080/check?tenant=globex
        trustForwardHeader: false
        maxResponseBodySize: 4096
  services:
    elasticsearch:
      loadBalancer:
        servers: [{ url: "http://elasticsearch:9200" }]
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
  certificates:
    - certFile: /certs/ingest-acme.crt
      keyFile: /certs/ingest-acme.key
    - certFile: /certs/ingest-globex.crt
      keyFile: /certs/ingest-globex.key
