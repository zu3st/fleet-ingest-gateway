# fleet-authz on Kubernetes: one Deployment for all tenants. Create the credential
# first (an API key with read_security only):
#   kubectl create secret generic fleet-authz-es --from-file=api-key=<file>
# The image comes from the release workflow (public on GHCR). Pin its digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-authz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-authz
  template:
    metadata:
      labels:
        app: fleet-authz
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet-authz
          image: ghcr.io/zu3st/fleet-ingest-gateway@sha256:<digest>
          env:
            - name: ES_URL
              value: https://<es-service>.<es-namespace>.svc:9200
            - name: ES_API_KEY_FILE
              value: /secrets/es/api-key
            - name: ES_CA_FILE
              value: /secrets/ca/ca.crt
            - name: MODE
              value: log-only # switch to enforce after the log-only review
            - name: TENANTS
              value: tenanta,tenantb
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: es-key
              mountPath: /secrets/es
              readOnly: true
            - name: es-ca
              mountPath: /secrets/ca
              readOnly: true
      volumes:
        - name: es-key
          secret:
            secretName: fleet-authz-es
        - name: es-ca
          secret:
            secretName: <es-ca-secret>
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-authz
spec:
  selector:
    app: fleet-authz
  ports:
    - name: http
      port: 8080
      targetPort: http
