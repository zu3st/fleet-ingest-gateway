# Example per-tenant Traefik CRDs for RKE2 + ECK. To add a tenant, copy its
# Middleware and IngressRoute and replace the name, host and TLS secret.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-runas
  namespace: elastic
spec:
  headers:
    customRequestHeaders:
      es-security-runas-user: ""
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: elasticsearch
  namespace: elastic
spec:
  serverName: prod-es-http.elastic.svc
  rootCAs:
    - secret: prod-es-http-certs-public
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: ingest
  namespace: elastic
spec:
  minVersion: VersionTLS12
  sniStrict: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fleet-authz-tenanta
  namespace: elastic
spec:
  forwardAuth:
    address: http://fleet-authz.elastic.svc:8080/check?tenant=tenanta
    trustForwardHeader: false
    maxResponseBodySize: 4096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingest-tenanta
  namespace: elastic
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`ingest-tenanta.example.com`) && ((Path(`/_bulk`) && Method(`POST`)) || (Path(`/`) && (Method(`GET`) || Method(`HEAD`))))'
      middlewares:
        - name: strip-runas
        - name: fleet-authz-tenanta
      services:
        - name: prod-es-http
          port: 9200
          scheme: https
          serversTransport: elasticsearch
  tls:
    secretName: ingest-tenanta-tls
    options:
      name: ingest
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fleet-authz-tenantb
  namespace: elastic
spec:
  forwardAuth:
    address: http://fleet-authz.elastic.svc:8080/check?tenant=tenantb
    trustForwardHeader: false
    maxResponseBodySize: 4096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingest-tenantb
  namespace: elastic
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`ingest-tenantb.example.com`) && ((Path(`/_bulk`) && Method(`POST`)) || (Path(`/`) && (Method(`GET`) || Method(`HEAD`))))'
      middlewares:
        - name: strip-runas
        - name: fleet-authz-tenantb
      services:
        - name: prod-es-http
          port: 9200
          scheme: https
          serversTransport: elasticsearch
  tls:
    secretName: ingest-tenantb-tls
    options:
      name: ingest
